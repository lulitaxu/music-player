name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator, generic)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -destination 'generic/platform=iOS Simulator'

      - name: Test (iPhone 16 simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  package-ipa:
    # Produces an UNSIGNED .ipa on every push to main. It is not
    # installable as-is; AltStore/SideStore re-sign it with the
    # installer's own Apple ID (free provisioning) during install.
    if: github.event_name == 'push'
    needs: build-test
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/DD/Build/Products/Debug-iphoneos/MusicApp.app Payload/
          zip -qry MusicPlayer-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-unsigned-ipa
          path: MusicPlayer-unsigned.ipa
          if-no-files-found: error
